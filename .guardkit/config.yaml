# GuardKit toolchain declaration (schema: guardkit/orchestrator/toolchain_declaration.py).
# Exit code is the verdict. GuardKit snapshots this block before a build starts.
# Started from react-go-monorepo 1.1.0; this fixture supplies the connected check.
toolchain:
  # Locked npm and Go module installs under the exact toolchain guards.
  install: "bash scripts/install.sh"
  install_timeout: 1200
  # The aggregate check: format, vet, Staticcheck, race tests, Go build,
  # contract drift, TypeScript, ESLint, Prettier, Vitest and the Vite build.
  test: "bash scripts/check.sh"
  test_timeout: 1800
  # Both suites must report real work: at least one Go `--- PASS:` line (Go
  # tests run with -v; a timed `ok` line also appears when every test calls
  # t.Skip, so it proves nothing) and a Vitest "Tests ... N passed" line with
  # N >= 1 (colour codes tolerated), and no replayed `ok <pkg> (cached)`
  # result. Byte-identical to the template (GuardKit 4f368202).
  requires_ran_marker: true
  ran_marker_regex: '(?ms)\A(?!.*^ok\s+\S+\s+\(cached\))(?=.*^\s*--- PASS: \S+)(?=.*Tests\b[^\n]*?[1-9][0-9]* passed)'
  # Coverage is measured, never thresholded: exit 0 means the tests passed
  # with coverage measured. Reports stay in git-ignored coverage/ folders.
  # Mirrors the template (GuardKit 7778352e).
  coverage: "bash scripts/coverage.sh"
  coverage_timeout: 1800
  # The connected browser/API/PostgreSQL/Keycloak journey on a fresh,
  # per-run compose project (scripts/check-feature.sh). It ends with a
  # "check-feature: PASS" line only after Playwright passed.
  feature_check: "bash scripts/check-feature.sh"
  feature_check_timeout: 1800
  runtime:
    go: "1.26.9"
    node: "22.23.2"
  components:
    web:
      cwd: "apps/web"
      test: "npm run test"
      test_timeout: 600
      requires_ran_marker: true
      ran_marker_regex: 'Tests\b[^\n]*?[1-9][0-9]* passed'
      # Vitest with V8 coverage; exit 0 when measured and the tests pass.
      coverage: "npm run coverage"
      coverage_timeout: 600
      runtime:
        node: "22.23.2"
    api:
      cwd: "apps/api"
      test: "GOTOOLCHAIN=local GOWORK=off GOFLAGS=-mod=readonly go test -race -count=1 -v ./..."
      test_timeout: 900
      requires_ran_marker: true
      # At least one test or subtest passed (an all-skipped or test-less run
      # prints no `--- PASS:` line) and nothing was replayed from the cache
      # (with -v a replay reprints old `--- PASS:` lines).
      ran_marker_regex: '(?ms)\A(?!.*^ok\s+\S+\s+\(cached\))(?=.*^\s*--- PASS: \S+)'
      # Written to files, not piped: the coach runs /bin/sh, where a pipe
      # would hide a failing `go tool cover`.
      coverage: "export GOTOOLCHAIN=local GOWORK=off GOFLAGS=-mod=readonly && mkdir -p coverage && go test -race -count=1 -coverprofile=coverage/go.out ./... && go tool cover -func=coverage/go.out > coverage/go-func.txt && tail -n 1 coverage/go-func.txt"
      coverage_timeout: 900
      runtime:
        go: "1.26.9"

# The factory's memory service keeps this project's knowledge under this name
# (letters, digits and underscores); `forge register-repo` requires it.
memory:
  project: react_go_notes_fixture

# What the launching process hands the Player's and Coach's shells.
# settings: names only, values copied from the launching process when set.
# scratch: each set to <worktree scratch folder>/toolchain/<NAME>, outside the
# project tree, so Go and npm caches, Go telemetry (XDG_CONFIG_HOME),
# Staticcheck's cache (XDG_CACHE_HOME) and Node's compile cache never land in
# the worktree.
launch:
  settings: [PLAYWRIGHT_BROWSERS_PATH]
  scratch: [GOPATH, GOCACHE, npm_config_cache, XDG_CONFIG_HOME, XDG_CACHE_HOME, NODE_COMPILE_CACHE]
