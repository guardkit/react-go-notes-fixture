id: FEAT-A91A
name: "Notes Done Flag"
description: "Add a boolean done flag to notes: a new migration adds a non-null done column defaulting to false (backfilling existing rows), GET /api/notes returns each note's done flag, the OpenAPI contract declares done as a required boolean on every note, and the generated web types are regenerated from that contract. Read-path only."
created: "2026-10-06T00:00:00Z"
status: planned
complexity: 6
estimated_tasks: 5

feature_files:
  - features/notes-done-flag/notes-done-flag.feature

scenario_owners:
  "A newly created note is not done by default": TASK-A91A-003
  "A note that existed before the migration is not done": TASK-A91A-001
  "GET /api/notes returns each note's stored done flag": TASK-A91A-003
  "A completed note is not omitted from the notes list": TASK-A91A-003
  "The done flag carries exactly the two boolean states": TASK-A91A-003
  "Every note in the response carries a done field": TASK-A91A-003
  "The done flag does not displace the existing note fields": TASK-A91A-003
  "The notes read endpoint does not accept a done value from the caller": TASK-A91A-003
  "The contract declares the done flag on the note object": TASK-A91A-002
  "The generated web note type includes the done flag": TASK-A91A-004
  "The done field reaches the web type only through regeneration": TASK-A91A-004

