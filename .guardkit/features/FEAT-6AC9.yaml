id: FEAT-6AC9
name: "Keycloak Realm Setup Readiness"
description: "Make the Keycloak realm setup wait for the admin login to be ready: retry the admin login and the first admin call only on 503 or a refused connection under a 2-minute total budget, fail straight away on any other error, and keep the admin password off every command line and message."
created: "2026-10-06T00:00:00Z"
status: planned
complexity: 6
estimated_tasks: 3

feature_files:
  - features/keycloak-realm-setup-readiness/keycloak-realm-setup-readiness.feature

scenario_owners:
  "Realm setup succeeds after Keycloak answers 503 a few times before it is ready": TASK-KRSR-001
  "Realm setup succeeds after a refused connection before Keycloak is ready": TASK-KRSR-001
  "The admin password is never placed on a command line": TASK-KRSR-001
  "A 503 response just inside the retryable set is retried": TASK-KRSR-001
  "A 500 response just outside the retryable set is not retried": TASK-KRSR-001
  "A Keycloak that becomes ready just inside the 2-minute budget is accepted": TASK-KRSR-001
  "A Keycloak that never becomes ready is given up on within the 2-minute budget": TASK-KRSR-001
  "A wrong admin password fails straight away with no retry": TASK-KRSR-001
  "The admin password is absent from all output of a failed run": TASK-KRSR-001
  "A Keycloak that never becomes ready by refusing the connection is given up on within the budget": TASK-KRSR-001

