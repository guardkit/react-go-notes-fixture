# The source of the notes API contract. apps/web/src/api-types.ts is generated
# from this file (`npm run contract:generate`) and `npm run contract:check`
# fails when the committed file has drifted. The Go handler tests validate the
# implemented responses against this same file (contract_test.go).
openapi: 3.0.3
info:
  title: Notes fixture API
  version: 1.0.0
  description: Neutral verification fixture. Every note belongs to the token's `sub`.
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Process liveness and the run this instance belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/notes:
    get:
      operationId: listNotes
      security:
        - bearer: []
      responses:
        "200":
          description: The signed-in owner's notes, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "500":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createNote
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewNote"
      responses:
        "201":
          description: The saved note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: The body or label is not acceptable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "500":
          $ref: "#/components/responses/Unavailable"
  /api/notes/{id}:
    patch:
      operationId: updateNoteDone
      description: >-
        The one write a caller may aim at a single note: its done flag. The id
        comes from the path, the owner from the token, and the flag from the
        body - nothing else, so the label and the creation time stay the row's
        own and come back as storage holds them. Setting the flag to what it
        already is answers the same note.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            The id of the note to update, as Note.id carries it. The owner and
            the id together decide whether a row is touched, so an id that is
            not one of the caller's notes - never written, belonging to someone
            else, or not a note id at all - answers the one 404 below.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchNoteRequest"
      responses:
        "200":
          description: The whole note as storage now holds it, carrying the flag the caller set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: The body carries no done flag, or one that is not a boolean, or anything beside the flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    NotFound:
      description: >-
        No note of the signed-in owner carries that id. A note that exists but
        belongs to someone else is answered identically - the same status, the
        same body shape, carrying neither the id nor the owner - so the answer
        cannot be read as a probe of whether another user's note exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SignInRequired:
      description: No token, or a token that is expired, unsigned, for another audience or from an unaccepted issuer.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Persistence failed; no detail is disclosed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, run]
      properties:
        status:
          type: string
          enum: [ok]
        run:
          type: string
    NewNote:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
    PatchNoteRequest:
      type: object
      additionalProperties: false
      required: [done]
      properties:
        done:
          type: boolean
      description: >-
        The whole of what the caller may change on one note: the completion
        flag, and nothing beside it. The id comes from the path, the owner from
        the token, and the label and creation time are never parameters of this
        write - the create path (NewNote) stays the only one that carries a
        label, and it still carries the label alone.
    Note:
      type: object
      additionalProperties: false
      required: [id, label, createdAt, done]
      properties:
        id:
          type: string
          pattern: "^[0-9]+$"
        label:
          type: string
          minLength: 1
          maxLength: 80
        createdAt:
          type: string
          format: date-time
        done:
          type: boolean
    NoteList:
      type: object
      additionalProperties: false
      required: [notes]
      properties:
        notes:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Note"
    Error:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
