# The source of the notes API contract. apps/web/src/api-types.ts is generated
# from this file (`npm run contract:generate`) and `npm run contract:check`
# fails when the committed file has drifted. The Go handler tests validate the
# implemented responses against this same file (contract_test.go).
openapi: 3.0.3
info:
  title: Notes fixture API
  version: 1.0.0
  description: Neutral verification fixture. Every note belongs to the token's `sub`.
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Process liveness and the run this instance belongs to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/notes:
    get:
      operationId: listNotes
      security:
        - bearer: []
      responses:
        "200":
          description: The signed-in owner's notes, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "500":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createNote
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewNote"
      responses:
        "201":
          description: The saved note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: The body or label is not acceptable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "500":
          $ref: "#/components/responses/Unavailable"
  /api/notes/{id}:
    patch:
      operationId: updateNoteDone
      description: >-
        The signed-in owner sets the done flag of one of their own notes. The
        flag is the sole mutable field: the note comes back with every other
        field exactly as it was stored.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the note, which must belong to the token's `sub`.
          schema:
            type: string
            pattern: "^[0-9]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoneUpdate"
      responses:
        "200":
          description: The updated note, carrying the flag the owner just set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          description: The body is not a JSON object carrying only a boolean done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NoteNotFound"
        "500":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    SignInRequired:
      description: No token, or a token that is expired, unsigned, for another audience or from an unaccepted issuer.
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Persistence failed; no detail is disclosed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoteNotFound:
      description: >-
        No note of the signed-in owner carries this id. The very same answer is
        given for a note that was never written and for one owned by someone
        else, so it discloses neither (ASSUM-003).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, run]
      properties:
        status:
          type: string
          enum: [ok]
        run:
          type: string
    NewNote:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
    # The whole body of a note update: the completion flag, and nothing else.
    # The flag is required and not nullable, so an absent, null or non-boolean
    # value is refused - a completion state the server cannot read as true or
    # false is not a flag - and additionalProperties false keeps the flag the
    # sole field a client may set.
    DoneUpdate:
      type: object
      additionalProperties: false
      required: [done]
      properties:
        done:
          type: boolean
    Note:
      type: object
      additionalProperties: false
      required: [id, label, createdAt, done]
      properties:
        id:
          type: string
          pattern: "^[0-9]+$"
        label:
          type: string
          minLength: 1
          maxLength: 80
        createdAt:
          type: string
          format: date-time
        # The completion flag the 0003 migration adds. The column is NOT NULL
        # DEFAULT false, so every stored row - including the rows written before
        # the column existed - carries a flag, and the endpoint answers with it
        # for every note. The contract therefore demands it: a note object
        # without a boolean done is not a note.
        done:
          type: boolean
    NoteList:
      type: object
      additionalProperties: false
      required: [notes]
      properties:
        notes:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Note"
    Error:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
