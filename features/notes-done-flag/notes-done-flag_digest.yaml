    basis: "The request names only the migration default and the GET response, so no mutation is proposed; the alternative is that a write path (e.g. PATCH /api/notes/{id} or a POST body field) is expected, in which case the flag would be permanently false for every note and the feature non-functional. The request does not state whether a write path is in scope."
  - id: ASSUM-005
    text: "Adding a field to the response is backward compatible: existing API consumers tolerate unknown properties and do not perform strict schema rejection"
    basis: "The request calls the change backward compatible for clients that ignore the new field, implying tolerant consumers; the alternative is strict clients that break on the new field, forcing a versioned endpoint or a coordinated client-first rollout. The request does not enumerate existing consumers."