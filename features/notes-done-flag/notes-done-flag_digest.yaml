feature: notes-done-flag
generated: "2026-07-09T14:32:00Z"
endpoint:
  method: GET
  path: /api/notes
scenarios:
  - title: "A newly created note is not done by default"
    tags: ["@key-example", "@smoke"]
    sentence: "A note created after the done flag exists comes back from the notes list marked as not done."
  - title: "A note that existed before the migration is not done"
    tags: ["@key-example"]
    sentence: "A note that was already there before the done flag was added is treated as not done."
  - title: "GET /api/notes returns each note's stored done flag"
    tags: ["@key-example", "@smoke"]
    sentence: "Reading the notes list returns each note with the done value that was stored for it, whether done or not done."
  - title: "A completed note is not omitted from the notes list"
    tags: ["@key-example"]
    sentence: "A finished note still shows up in the notes list alongside unfinished ones, each carrying its own done value."
  - title: "The done flag carries exactly the two boolean states"
    tags: ["@boundary"]
    sentence: "The done flag only ever holds the two states done or not done, and both survive a round trip through the notes list."
  - title: "Every note in the response carries a done field"
    tags: ["@boundary"]
    sentence: "Every note in the notes list response includes a done value, never a missing or empty one."
  - title: "The done flag does not displace the existing note fields"
    tags: ["@boundary"]
    sentence: "Adding the done flag leaves a note's existing details intact, so it is returned with its original fields plus the done value."
  - title: "The notes read endpoint does not accept a done value from the caller"
    tags: ["@negative"]
    sentence: "Trying to change a note's done value through the read endpoint is ignored, and the note keeps its stored done value."
  - title: "A signed-in owner cannot read another owner's notes"
    tags: ["@negative"]
    sentence: "Reading the notes list never reveals another person's notes, regardless of their done value."
  - title: "The contract declares the done flag on the note object"
    tags: ["@key-example"]
    sentence: "The API contract describes the note object as always carrying a done value."
  - title: "The generated web note type includes the done flag"
    tags: ["@key-example"]
    sentence: "The client's note type, generated from the contract, carries the same done value the server returns."
  - title: "The done field reaches the web type only through regeneration"
    tags: ["@edge-case"]
    sentence: "The client's done field appears only by regenerating the types from the updated contract, never by editing the generated files by hand."
assumptions:
  - id: ASSUM-001
    text: "Pre-existing note rows are backfilled to done=false when the migration runs, so no legacy note is treated as done"
    basis: "The request says 'false by default' but does not state the backfill behaviour for rows that already exist; the alternative is that existing rows are left null or done, which would change the column's nullability and the read output for legacy notes"
  - id: ASSUM-002
    text: "The done flag is a simple boolean (done / not-done), not a richer status enum"
    basis: "The request calls it a 'done flag' and a 'done column' but never names the type; the alternative is a status enum, which would change the migration column type, the API serialization, the contract property type, and the generated web type"
  - id: ASSUM-003
    text: "This slice is read-path only; no endpoint to create, update, or toggle the done flag is in scope"
    basis: "The request describes only the migration and GET /api/notes; the alternative is that a mutation endpoint (PATCH/PUT or a create-time field) is expected, which would expand scope beyond the stated problem"
  - id: ASSUM-004
    text: "The contract declares done as a required boolean present on every note, not optional"
    basis: "The request says the contract is 'updated to match' the response but does not say required vs optional; the alternative is an optional property, which would let the generated web type mark done as possibly absent"
  - id: ASSUM-005
    text: "The web types are regenerated from the contract as part of this change rather than being hand-edited"
    basis: "The request says 'the generated web types updated to match' but does not say whether regeneration is automated in CI or a manual step; the alternative is hand-editing the generated files, which would break the contract-as-source-of-truth ordering"
  - id: ASSUM-006
    text: "The done flag is scoped to the signed-in owner and the read endpoint continues to return only the caller's own notes"
    basis: "The request does not mention ownership or authorization for the done flag; the alternative is that the done flag is shared across owners, which would change what GET /api/notes returns"
