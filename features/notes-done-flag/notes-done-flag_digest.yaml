assumptions:
  - id: ASSUM-001
    text: "Notes are persisted in a relational database addressed by a single notes table, so 'a new migration' means a schema change to that table"
    basis: "The request says 'a new migration adds a done column' (relational-migration wording) and the README shows apps/api/migrations 0001/0002 against a notes table; the alternative is a document/key-value store where the change would be a schemaless per-record defaulting rollout. Not stated explicitly in the request."
  - id: ASSUM-002
    text: "GET /api/notes already exists and returns a collection of note objects; this change adds a field rather than introducing the endpoint"
    basis: "The README and handler.go show GET /api/notes already serving a signed-in owner's notes, so the change is a field addition; the alternative is that the endpoint does not exist and the epic would cover the full list endpoint (pagination, auth, empty-collection semantics). The request does not restate the endpoint's existence."
  - id: ASSUM-003
    text: "The web types are machine-generated from the API contract by an existing codegen step, so updating the contract and re-running codegen satisfies 'generated web types updated to match'"
    basis: "The README states apps/web/src/api-types.ts is generated from contract/openapi.yaml via npm run contract:generate and committed, so codegen is the mechanism; the alternative is hand-maintained types, which would make FEAT-PO-004 a manual edit and make the 'regeneration is a no-op' constraint inapplicable. The request does not name the codegen step."
  - id: ASSUM-004
    text: "done is a two-valued boolean completion state, not a richer lifecycle such as a timestamp, enum, or per-user acknowledgement"
    basis: "The request says 'a done flag ... false by default' and the contract declares a required boolean, implying two-valued state; the alternative is a richer model (completion timestamp/enum) that would change the column type, the contract property type and the generated type. The request does not enumerate the lifecycle."
  - id: ASSUM-005
    text: "This change is read-only with respect to the flag: no client-facing write path for setting done is in scope"
    basis: "The request names only the migration default and the GET response, so no mutation is proposed; the alternative is that a write path (e.g. PATCH /api/notes/{id} or a POST body field) is expected, in which case the flag would be permanently false for every note and the feature non-functional. The request does not state whether a write path is in scope."
  - id: ASSUM-006
    text: "The notes table is small enough that adding a non-nullable column with a constant default can be done in a single straightforward migration without an online/lock-aware strategy"
    basis: "The request asks for 'a new migration' as a single ordered schema change, implying a straightforward add; the alternative is a large table where the add could lock writes and require a two-phase add-default-backfill approach. The request does not state the table size."
  - id: ASSUM-007
    text: "Adding a field to the response is backward compatible: existing API consumers tolerate unknown properties and do not perform strict schema rejection"
    basis: "The request calls the change backward compatible for clients that ignore the new field, implying tolerant consumers; the alternative is strict clients that break on the new field, forcing a versioned endpoint or a coordinated client-first rollout. The request does not enumerate existing consumers."
  - id: ASSUM-008
    text: "The contract and the generated web types are versioned and deployed together with the API change, so no window exists where the deployed API and the committed contract disagree"
    basis: "The constraints say contract and generated web types must be updated in the same change set, implying co-deployment; the alternative is independent release of contract and types, which opens a drift window and would require the parity gate to run in CI against both artefacts separately. The request does not state the release cadence."