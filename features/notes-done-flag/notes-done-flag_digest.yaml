assumptions:
  - id: ASSUM-001
    text: "Notes are persisted in a relational database addressed by a single notes table, so 'a new migration' means a schema change to that table"
    basis: "The request says 'a new migration adds a done column' (relational-migration wording) and the README shows apps/api/migrations 0001/0002 against a notes table; the alternative is a document/key-value store where the change would be a schemaless per-record defaulting rollout. Not stated explicitly in the request."
