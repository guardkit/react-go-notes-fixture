scenarios:
  - title: "Owner sets a note's done flag to true"
    tags: ["@key-example", "@smoke"]
    sentence: "A signed-in owner marks their own note as done and receives the updated note back with the done flag set to true."
  - title: "Owner sets a note's done flag to false"
    tags: ["@key-example", "@smoke"]
    sentence: "A signed-in owner marks their own note as not done and receives the updated note back with the done flag set to false."
  - title: "Re-sending the same done value yields the same updated note"
    tags: ["@key-example"]
    sentence: "Sending the same done value twice in a row leaves the note in the same state and returns the same updated note each time."
  - title: "The done flag accepts each boolean value"
    tags: ["@boundary"]
    sentence: "Setting the done flag to either true or false is accepted and reflected in the returned note."
  - title: "A non-boolean done value is rejected"
    tags: ["@boundary", "@negative"]
    sentence: "Sending a done value that is not true or false is refused and leaves the note's done flag unchanged."
  - title: "A note id that does not exist is answered with 404"
    tags: ["@negative"]
    sentence: "Trying to update a note id that matches no note is answered with not-found and changes nothing."
  - title: "A note belonging to another user is answered with 404"
    tags: ["@negative"]
    sentence: "Trying to update someone else's note is answered with not-found rather than forbidden, so the note's existence is not revealed."
  - title: "The missing-note and foreign-note responses are indistinguishable"
    tags: ["@negative"]
    sentence: "A request for a nonexistent note and a request for another user's note produce the same not-found response shape, so a caller cannot tell the two apart."
  - title: "An unauthenticated request is refused before any note mutation"
    tags: ["@negative"]
    sentence: "A PATCH request with no signed-in session is refused as sign-in required and does not change any note."
  - title: "A syntactically malformed note id is answered with 404"
    tags: ["@edge-case"]
    sentence: "A note id that is not well-formed is treated as not-found and changes nothing."
  - title: "The updated note representation carries its identity and new done state"
    tags: ["@edge-case"]
    sentence: "The response to a successful update includes the note's own id and its new done state and nothing belonging to other notes."
